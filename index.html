<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Swarm</title>
<meta name="description" content="A journey to a Dyson Sphere: from the satellites circling Earth to a swarm around the Sun.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #ece2cc; --gold: #d9b46a; --gold2: #f1d79a; --mute: #9d937f; }
  html, body { margin: 0; background: #000; color: var(--ink); }
  body { font-family: Inter, system-ui, sans-serif; overscroll-behavior: none; }
  /* the film sits still on screen; the page scrolls past it, and the scroll chooses the frame */
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  #v { width: 100vw; height: 100vh; object-fit: cover; display: block; background: #000; }

  @media (max-aspect-ratio: 3/2) { #v { object-fit: contain; } }
  #track { height: 2400vh; }
  /* the previous frame, laid over the new one and faded out: slow scrolling flows instead of stepping */
  #ghost { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; opacity: 0; }
  /* the scroll hint: a mouse with a rolling wheel, or a finger's swipe on touch screens */
  #hint { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); z-index: 9; text-align: center; pointer-events: none;

  #veil .t { text-align: center; }

  #veil p { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: clamp(18px, 2vw, 26px); color: #cfc4ab; margin: 10px 0 34px; }
  #bar { width: min(320px, 60vw); height: 1px; background: rgba(241,215,154,.18); margin: 0 auto; }
  #fill { height: 100%; width: 0; background: var(--gold2); transition: width .2s linear; }
  #pct { font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--mute); margin-top: 14px; }
  #sbar { position: fixed; left: 0; right: 0; top: 0; height: 2px; z-index: 8; background: rgba(255,255,255,.04); }
  #sprog { height: 100%; background: linear-gradient(90deg, #6d5424, #f1d79a); transform-origin: 0 0; transform: scaleX(0); }
  #scue { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 7; text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: #b3a98f; transition: opacity .6s; }
  #scue i { display: block; width: 1px; height: 38px; margin: 10px auto 0; background: linear-gradient(#f1d79a, transparent); animation: drip 2.2s ease-in-out infinite; }
  @keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
  #snd { position: fixed; right: clamp(18px, 3vw, 40px); bottom: 26px; z-index: 9; display: flex; align-items: center; gap: 3px; height: 34px; padding: 0 16px 0 14px;
    border: 1px solid rgba(217,180,106,.45); background: rgba(14,10,6,.82); color: var(--gold2); cursor: pointer;
    font: 500 10.5px Inter, sans-serif; letter-spacing: .28em; text-transform: uppercase; }
  #snd i { display: block; width: 2px; height: 4px; background: var(--gold2); opacity: .6; }
  #snd span { margin-left: 10px; }
  #snd.on i { animation: eq 1.1s ease-in-out infinite; opacity: .95; }
  #snd.on i:nth-child(2) { animation-delay: -.3s; } #snd.on i:nth-child(3) { animation-delay: -.6s; } #snd.on i:nth-child(4) { animation-delay: -.85s; }
  #snd.wait { border-color: rgba(241,215,154,.85); }
  @keyframes eq { 0%,100% { height: 4px; } 50% { height: 14px; } }
  #end { position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%); z-index: 9; opacity: 0; pointer-events: none; transition: opacity .8s; }
  #end.show { opacity: 1; pointer-events: auto; }
  #end a { display: inline-block; font: 500 11px Inter, sans-serif; letter-spacing: .26em; text-transform: uppercase; color: var(--gold2);
    border: 1px solid rgba(217,180,106,.55); padding: 15px 24px; text-decoration: none; background: rgba(20,15,8,.8); }
  #end a:hover { background: rgba(217,180,106,.16); }
</style>

<body>
<div id="stage"><video id="v" muted playsinline preload="auto" disablepictureinpicture></video></div>
<div id="track"></div>
<div id="sbar"><div id="sprog"></div></div>
<canvas id="ghost"></canvas>
<div id="hint"><div class="mouse"></div><div class="label">Scroll to begin</div><div class="chev"></div></div>
<button id="snd" type="button" aria-label="Sound"><i></i><i></i><i></i><i></i><span>Sound on</span></button>
<div id="end"><a href="window.html">Walk the window</a></div>
<div id="veil"><div class="t"><h1>The Swarm</h1><p>A journey to a Dyson Sphere</p><div id="bar"><div id="fill"></div></div><div id="pct">Loading</div></div></div>
<script>
(() => {
'use strict';

}

// the score and the glass, exactly as on the live site
// =====================================================================
//   THE SCORE: generated live, following the story
//   chapel: a hushed choir and organ in D minor  ·  the break: a held breath, then air
//   the land: a harp in D major, wind, birds  ·  the flight: rising, brightening
//   space: vast slow chords and bells  ·  the mission: everything at once  ·  the end: home

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const ACTS = {
  chapel:  { dur: 8,   cut: 950,  pad: 0.17, bass: 0.13, pluck: 0,    bell: 0.02, wind: 0.012, step: 0,    chords: [[38, 57, 62, 64, 65, 69], [34, 57, 62, 65, 69, 74], [43, 58, 62, 65, 69, 74], [45, 57, 62, 64, 69, 76]] },
  brk:     { dur: 6,   cut: 1700, pad: 0.2,  bass: 0.14, pluck: 0,    bell: 0.05, wind: 0.04,  step: 0,    chords: [[38, 57, 62, 64, 69, 76]] },
  land:    { dur: 4.4, cut: 2300, pad: 0.13, bass: 0.1,  pluck: 0.07, bell: 0,    wind: 0.05,  step: 0.34, chords: [[38, 57, 62, 66, 69, 74], [43, 59, 62, 67, 71, 74], [47, 59, 62, 66, 71, 74], [45, 57, 61, 64, 69, 76]] },
  flight:  { dur: 2.6, cut: 4200, pad: 0.17, bass: 0.12, pluck: 0.07, bell: 0.03, wind: 0.09,  step: 0.17, chords: [[47, 59, 62, 66, 71, 74], [43, 59, 62, 67, 71, 79], [42, 57, 62, 66, 69, 78], [45, 57, 61, 64, 69, 81]] },
  space:   { dur: 9,   cut: 1500, pad: 0.17, bass: 0.12, pluck: 0,    bell: 0.05, wind: 0.02,  step: 0,    chords: [[38, 57, 61, 64, 66, 73], [43, 59, 61, 66, 67, 74], [40, 55, 59, 62, 66, 71], [35, 57, 62, 64, 66, 69]] },
  swarm:   { dur: 6,   cut: 2400, pad: 0.15, bass: 0.12, pluck: 0.05, bell: 0.05, wind: 0.02,  step: 0.21, chords: [[38, 57, 61, 64, 69, 73], [43, 59, 62, 66, 71, 74], [40, 59, 62, 67, 71, 76], [45, 57, 61, 64, 69, 76]] },
  mission: { dur: 7,   cut: 3200, pad: 0.3,  bass: 0.21, pluck: 0,    bell: 0.07, wind: 0.02,  step: 0,    chords: [[38, 57, 62, 66, 69, 74, 78]] },
  finale:  { dur: 9,   cut: 2000, pad: 0.18, bass: 0.13, pluck: 0,    bell: 0.04, wind: 0.015, step: 0,    chords: [[38, 57, 62, 64, 69, 76], [38, 57, 62, 66, 69, 74]] },

function actAt(p) {

}
let MX = null, musicOn = true;    // sound is on by default; it plays as soon as the browser allows
function noiseBuf(ac, sec) { const n = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; return b; }

  M.rev = ac.createConvolver(); M.rev.buffer = ir;

  M.padF = ac.createBiquadFilter(); M.padF.type = 'lowpass'; M.padF.frequency.value = 900; M.padF.Q.value = 0.4;
  M.vowel = ac.createBiquadFilter(); M.vowel.type = 'peaking'; M.vowel.frequency.value = 880; M.vowel.gain.value = 6; M.vowel.Q.value = 1.2;
  M.padG = ac.createGain(); M.padG.gain.value = 0; M.padF.connect(M.vowel); M.vowel.connect(M.padG); M.padG.connect(M.bus);
  M.voices = [];

    const g = ac.createGain(); g.gain.value = 0.0; g.connect(M.padF);
    const os = [-7, 7].map(c => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.detune.value = c + (Math.random() - 0.5) * 4; o.connect(g); o.start(); return o; });

function bell(M, f, t, vol, pan) {

function bird(M, t) {
  const ac = M.ac, n = 2 + Math.floor(Math.random() * 4), base = 2600 + Math.random() * 1600, pan = Math.random() * 1.4 - 0.7;
  for (let i = 0; i < n; i++) { const o = ac.createOscillator(), g = ac.createGain(), t0 = t + i * (0.09 + Math.random() * 0.05);

function music(p) {

  M.padG.gain.setTargetAtTime(A.pad * lift, now, 1.2); M.bassG.gain.setTargetAtTime(A.bass * lift, now, 1.5);
  M.padF.frequency.setTargetAtTime(A.cut * (name === 'flight' ? 1 + seg(p, P_FLY, P_WHITE) : 1), now, 1.2);
  M.windG.gain.setTargetAtTime(A.wind, now, 1.2);
  M.windF.frequency.setTargetAtTime(name === 'flight' ? 900 + 3200 * seg(p, P_FLY, P_WHITE) : name === 'land' ? 520 + 180 * Math.sin(now * 0.31) : 380, now, 0.6);

    if (M.nextNote < now) M.nextNote = now + 0.05;
    while (M.nextNote < now + 0.2) {
      const ch = A.chords[M.chord], tones = ch.slice(1), n = tones.length;
      const up = name === 'flight' ? M.arp % (n * 2) : M.arp % (2 * n - 2);
      const idx = name === 'flight' ? up % n : (up < n ? up : 2 * n - 2 - up);
      const oct = name === 'flight' ? Math.floor(up / n) * 12 : name === 'swarm' ? 12 : 0;
      const f = mtof(tones[idx] + oct);

    const ch = A.chords[M.chord], m = ch[1 + Math.floor(Math.random() * (ch.length - 1))];
    bell(M, mtof(m + (name === 'chapel' ? -12 : 12)), now + 0.05, A.bell, Math.random() * 1.2 - 0.6);
    M.nextBell = now + (name === 'chapel' ? 6 + Math.random() * 6 : 2.5 + Math.random() * 4);

function setChord(M, A, now, glide) {
  const ch = A.chords[M.chord];
  M.bass.forEach(b => b.o.frequency.setTargetAtTime(mtof(ch[0]) * b.h, now, glide));
  M.voices.forEach((v, i) => {

}

// ---------------------------------------------------------------- the sound of glass breaking
// a crack, the burst of the pane, then the small bright pieces raining down
function shatter(intensity, pan, delay) {

    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1.0 * I, t + 0.004); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500; src.connect(hp);
    for (let k = 0; k < (I > 0.6 ? 5 : 3); k++) { const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2800 + Math.random() * 7000; bp.Q.value = 8 + Math.random() * 25; hp.connect(bp); bp.connect(g); }
    P(g); src.start(t, nOff, dur); }
  // weight
  if (I > 0.4) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.25);
    g.gain.setValueAtTime(0.28 * I, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35); o.connect(g); P(g); o.start(t); o.stop(t + 0.4); }

    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f;

    g.gain.setValueAtTime(0, tk); g.gain.linearRampToValueAtTime(v, tk + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, tk + 0.04 + Math.random() * 0.14);
    o.connect(g); P(g); o.start(tk); o.stop(tk + 0.2);
  }
}

// ---------------------------------------------------------------- sound: on by default
// browsers hold back sound until the visitor first clicks, taps or presses a key; until then the button invites a tap
const sndBtn = document.getElementById('snd');
let sndShown = '';
function sndState() { const ac = actx; return !soundOn ? 'off' : (ac && ac.state === 'running') ? 'on' : 'wait'; }
function setSndLabel() {
  if (!sndBtn) return; const st = sndState(); if (st === sndShown) return; sndShown = st;
  sndBtn.classList.toggle('on', st === 'on'); sndBtn.classList.toggle('wait', st === 'wait');
  sndBtn.querySelector('span').textContent = st === 'on' ? 'Sound on' : st === 'wait' ? 'Tap for sound' : 'Sound off';
}
function startSound() { const ac = audio(); if (ac && ac.state !== 'running') ac.resume().then(setSndLabel, () => {}); musicOn = true; soundOn = true; setSndLabel(); }
if (sndBtn) sndBtn.addEventListener('click', e => { e.stopPropagation(); if (sndState() === 'on') soundOn = false; else startSound(); setSndLabel(); });
// try at once (some browsers allow it), and again on every kind of first touch
try { audio(); if (actx && actx.state !== 'running') actx.resume().then(setSndLabel, () => {}); } catch (e) {}
const unlock = e => {
  if (e && e.target && e.target.closest && e.target.closest('#snd')) return;
  if (soundOn) startSound();
  if (actx && actx.state === 'running') ['pointerdown', 'keydown', 'touchend', 'mousedown', 'wheel'].forEach(t => window.removeEventListener(t, unlock, true));
};
['pointerdown', 'keydown', 'touchend', 'mousedown', 'wheel'].forEach(t => window.addEventListener(t, unlock, true));
setInterval(setSndLabel, 400);


// ---------------------------------------------------------------- the film, scrubbed by the scroll
let v = document.getElementById('v'); const veil = document.getElementById('veil');
const SRC = 'film.mp4', PARTS = [];      // where a host limits file sizes, the film comes in pieces
let dur = 117, shown = 1.6, vel = 0, wanted = 0, ready = false, lastP = 0, lastT = performance.now(), lastScroll = performance.now();
v.addEventListener('loadedmetadata', () => { dur = v.duration || dur; });
const progress = f => { document.getElementById('fill').style.width = (f * 100).toFixed(1) + '%'; document.getElementById('pct').textContent = 'Loading ' + Math.round(f * 100) + '%'; };
// pull the whole film into memory, so every frame is instantly at hand when the scroll asks for it
async function pull(url, onBytes) {
  const r = await fetch(url); const rd = r.body.getReader(); const out = [];
  for (;;) { const { done, value } = await rd.read(); if (done) break; out.push(value); onBytes(value.length); }
  return out;
}
(async () => {
  try {
    let got = 0, chunks;
    if (PARTS.length) {
      const total = PARTS.reduce((a, p) => a + p.size, 0);
      const all = await Promise.all(PARTS.map(p => pull(p.url, n => { got += n; progress(got / total); })));
      chunks = all.flat();
    } else {
      // the film opens as soon as its first frames arrive, streamed from the host; the rest comes down behind it
      v.src = SRC;
      v.addEventListener('canplay', () => { ready = true; setTimeout(() => veil.classList.add('gone'), 400); }, { once: true });
      const r = await fetch(SRC, { method: 'HEAD' }); const total = +r.headers.get('content-length') || 0;
      chunks = await pull(SRC, n => { got += n; if (total) progress(got / total); });
    }
    // swap to the copy in memory without a flicker: a second player takes the same frame, then replaces the first
    const url = URL.createObjectURL(new Blob(chunks, { type: 'video/mp4' }));
    const v2 = document.createElement('video'); v2.id = 'v'; v2.muted = true; v2.playsInline = true; v2.preload = 'auto'; v2.src = url;
    await new Promise(res => v2.addEventListener('loadeddata', res, { once: true }));
    v2.currentTime = shown; await new Promise(res => v2.addEventListener('seeked', res, { once: true }));
    v.replaceWith(v2); v.removeAttribute('src'); v.load(); v = v2;
  } catch (e) { if (!v.src) v.src = PARTS.length ? PARTS[0].url : SRC; }
  ready = true; veil.classList.add('gone');
})();
// the blend layer: just before each new frame is asked for, the frame on screen is copied here, then faded away
const ghost = document.getElementById('ghost'), gx = ghost.getContext('2d', { alpha: true });
let ghostA = 0;
function sizeGhost() { const r = Math.min(devicePixelRatio || 1, 1.5); ghost.width = Math.round(innerWidth * r); ghost.height = Math.round(innerHeight * r); }
sizeGhost(); addEventListener('resize', sizeGhost);
function holdFrame() {
  if (!v.videoWidth) return;
  const W = ghost.width, H = ghost.height, vw = v.videoWidth, vh = v.videoHeight;
  const cover = (innerWidth / innerHeight) > 1.5, k = cover ? Math.max(W / vw, H / vh) : Math.min(W / vw, H / vh);
  const dw = vw * k, dh = vh * k;
  gx.clearRect(0, 0, W, H); gx.drawImage(v, (W - dw) / 2, (H - dh) / 2, dw, dh); ghostA = 0.6;   // a soft blend, never a trail
}
addEventListener('scroll', () => { lastScroll = performance.now(); }, { passive: true });
// ---------------------------------------------------------------- pacing: how much scroll each moment of the film takes
// [film second, weight]: heavier where there is something to read or feel, lighter through the connecting moves,
// an exponential rush into the Sun, a hard brake on arrival. Linear between points, so the speed never jumps.
const PACE = [[1.6, 0.9], [4.4, 0.9], [5.4, 0.32], [11.6, 0.32], [12.7, 1.0], [19.5, 1.0], [20.4, 0.28], [25.4, 0.28], [26.4, 0.95], [30.5, 0.95],
  [31.6, 1.15], [38.5, 1.15], [40, 0.7], [44.5, 0.4], [46.2, 0.32], [49.6, 0.85], [59, 0.85], [60.3, 1.0],
  ...[62, 63.5, 65, 66.5, 68, 69].map(t => [t, Math.exp(-0.085 * (t - 60.3))]),  // the flight: starts slow, gathers speed, about twice as fast by the end
  [70, 0.5], [71, 1.1], [79.5, 1.1], [80.6, 0.32], [82.6, 1.0], [91.5, 1.0], [92.6, 0.35], [99, 0.35], [100.2, 0.9], [109, 0.9], [111, 0.3], [117, 0.3]];
const T0 = 1.6, PACE_N = 4000, paceT = new Float32Array(PACE_N + 1), paceS = new Float32Array(PACE_N + 1);

  // the page is as long as the pacing needs: about a fifth of a screen per unit of weight
  document.getElementById('track').style.height = Math.round(S * 19 + 100) + 'vh'; }
function timeAt(f) {                    // scroll fraction -> film second, through the pacing curve
  const S = f * paceS[PACE_N]; let lo = 0, hi = PACE_N;

  const w = 7.5; vel += (w * w * (wanted - shown) - 2 * w * vel) * dt; shown += vel * dt;
  if (Math.abs(wanted - shown) < 0.002 && Math.abs(vel) < 0.01) { shown = wanted; vel = 0; }
  if (ready && !v.seeking && Math.abs(v.currentTime - shown) > 1 / 60) { holdFrame(); v.currentTime = shown; }
  ghostA = Math.max(0, ghostA - dt * 12); ghost.style.opacity = ghostA.toFixed(3);

  const idle = now - lastScroll > 2600, atStart = f < 0.004, atEnd = f > 0.985;
  hint.classList.toggle('show', ready && !atEnd && (atStart || (idle && Math.abs(vel) < 0.01)));
  hintLabel.textContent = atStart ? (touch ? 'Swipe up to begin' : 'Scroll to begin') : (touch ? 'Keep swiping' : 'Keep scrolling');
  const p = filmP(shown);
  music(p);
  if (p >= P_REL0 && lastP < P_REL0) shatter(1, 0, 0.05);            // the glass goes as you scroll through it
  lastP = p;
  document.getElementById('sprog').style.transform = `scaleX(${f.toFixed(4)})`;
  document.getElementById('end').classList.toggle('show', f > 0.985);

requestAnimationFrame(frame);
})();
